name: Refresh profile cards

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh contribution data
        env:
          # Optional CONTRIB_TOKEN (classic PAT, read:user) counts private contributions.
          GH_TOKEN: ${{ secrets.CONTRIB_TOKEN || github.token }}
        run: |
          gh api graphql -F login="${{ github.repository_owner }}" -f query='
            query($login: String!) { user(login: $login) { contributionsCollection {
              contributionCalendar { weeks { contributionDays { date contributionCount } } } } } }' \
            --jq '[.data.user.contributionsCollection.contributionCalendar.weeks[].contributionDays[] | {date, count: .contributionCount}]' \
            > data/contributions.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render cards
        run: |
          pip install fonttools==4.61.0
          python build_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards
          git diff --cached --quiet || { git commit -m "chore: refresh profile cards"; git push; }
